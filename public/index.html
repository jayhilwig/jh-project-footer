<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>JH Project Footer</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f4ef;color:#111;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
    main{min-height:calc(100vh - 44px);display:grid;place-items:center;padding:40px 24px}
    .demo{width:min(780px,100%)}
    .eyebrow{font:600 11px/1 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.09em;text-transform:uppercase;margin-bottom:14px}
    h1{font-size:clamp(40px,7vw,88px);line-height:.93;letter-spacing:-.055em;margin:0 0 20px;font-weight:650}
    p{max-width:560px;color:#62605a;font-size:16px;line-height:1.5}
    code{background:rgba(0,0,0,.06);padding:2px 4px;border-radius:3px}
  </style>
</head>
<body>
  <main>
    <div class="demo">
      <div class="eyebrow">JH / Shared Project Footer / v1.0.4</div>
      <h1>One footer.<br>Every build.</h1>
      <p>Production demo. All configured project links open in a new tab/window.</p>
    </div>
  </main>

  <script defer src="/jh-footer.min.js?v=1.0.4"></script>
  <jh-project-footer project="demo"></jh-project-footer>
</body>
</html>
